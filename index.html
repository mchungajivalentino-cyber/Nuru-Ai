<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURU AI Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Jost&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Jost', sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        header {
            background: linear-gradient(90deg, #8B8000, #DAA520);
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3em;
            color: white;
        }
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .denomination {
            display: flex;
            justify-content: space-around;
            margin: 20px;
        }
        .chat-interface {
            width: 300px;
            height: 500px;
            border: 1px solid #DAA520;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .features {
            background-color: #fff;
            padding: 20px;
        }
        footer {
            background-color: #8B8000;
            text-align: center;
            padding: 10px;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>NURU AI</h1>
    </header>
    <div class="hero">
        <h2>Welcome to NURU AI</h2>
    </div>
    <div class="denomination">
        <div>General Christian</div>
        <div>Catholic</div>
        <div>Anglican</div>
        <div>Lutheran</div>
        <div>Counseling</div>
    </div>
    <div class="chat-interface">
        <p>Chat preview here...</p>
    </div>
    <div class="features">
        <h3>Features</h3>
        <p>Feature 1: AI Support</p>
        <p>Feature 2: Community Engagement</p>
        <p>Feature 3: Resource Access</p>
    </div>
    <footer>
        <p>&copy; 2026 NURU AI. All rights reserved.</p>
    </footer>
</body>
</html>
